<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive Negative Checker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-indigo-200 via-purple-200 to-pink-200">

    <div class="bg-white shadow-2xl rounded-3xl p-10 w-[380px] text-center">

        <h1 class="text-3xl font-bold text-purple-600 mb-6">
            Number Checker
        </h1>

        <input
            type="number"
            id="doc"
            placeholder="Enter a number"
            class="w-full border-2 border-purple-300 rounded-xl p-3 outline-none focus:border-purple-500 mb-5">

        <button
            onclick="checkNumber()"
            class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-semibold transition duration-300">
            Check Number
        </button>

        <div
            id="output"
            class="mt-6 text-xl font-bold text-gray-700 bg-gray-100 rounded-xl p-4">
           
        </div>

    </div>

    <script>
        function checkNumber() {

            let doc = Number(document.getElementById("doc").value);

            if (doc > 0) {
                document.getElementById("output").innerHTML =
                    " This number is Positive";
            }
            else if (doc == 0) {
                document.getElementById("output").innerHTML =
                    " This number is Zero";
            }
            else {
                document.getElementById("output").innerHTML =
                    " This number is Negative";
            }

        }
    </script>

</body>
</html>
